name: Probe candidate URLs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          while IFS=$'\t' read -r id url; do
            out=$(curl -s -L --max-time 25 -A "$UA" -H 'Accept: text/html,*/*' -H 'Accept-Language: en-AU,en;q=0.9' --compressed -o body.html -w '%{http_code}\t%{url_effective}\t%{size_download}' "$url" || echo "ERR")
            title=$(grep -o -i -m1 '<title[^>]*>[^<]*' body.html 2>/dev/null | sed 's/<title[^>]*>//I' | tr -s ' \t\r\n' ' ' | cut -c1-70)
            links=$(grep -o -i '<a ' body.html 2>/dev/null | wc -l)
            printf 'PROBE\t%s\t%s\t%s\tlinks=%s\t%s\n' "$id" "$out" "$links" "$title"
            rm -f body.html
          done < .github/probe-urls.tsv
