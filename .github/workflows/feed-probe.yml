name: Probe for news feeds
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for RSS/Atom feeds
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          get() { curl -s -L --max-time 20 -A "$UA" --compressed -o body -w '%{http_code}' "$1" || echo 000; }
          isfeed() { head -c 3000 body | grep -qiE '<rss|<feed|<rdf:RDF'; }
          while IFS=$'\t' read -r id url; do
            code=$(get "$url")
            if isfeed; then echo "FEED	$id	$code	$url"; continue; fi
            links=$(grep -oiE '<link[^>]+(rss|atom)\+xml[^>]*>' body | grep -oiE 'href="[^"]+"' | sed 's/href="//;s/"$//' | sort -u | head -5 | tr '\n' ' ')
            pagelinks=$(grep -oiE 'href="[^"]*(rss|feed|atom)[^"]*"' body | sed 's/href="//;s/"$//' | sort -u | head -8 | tr '\n' ' ')
            echo "PAGE	$id	$code	link-tags: $links	anchors: $pagelinks"
            origin=$(echo "$url" | grep -oE '^https?://[^/]+')
            for p in /feed/ /rss /rss.xml /feed.xml /atom.xml /news/feed/ /index.xml /rss/news; do
              c=$(get "$origin$p")
              if isfeed; then echo "FEED	$id	$c	$origin$p"; fi
            done
          done < .github/feed-probe.tsv
