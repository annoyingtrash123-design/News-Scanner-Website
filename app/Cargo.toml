[package]
name = "news-scanner"
version = "1.0.0"
edition = "2021"
description = "Watch web pages for changes and new documents, with email alerts"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
scraper = "0.20"
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5"
rust-embed = "8"
anyhow = "1"
dirs = "5"
hmac = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
